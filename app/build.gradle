plugins { id 'com.android.application' }
def signingFile = rootProject.file('signing.properties')
def localSigning = new Properties()
if (signingFile.exists()) signingFile.withInputStream { localSigning.load(it) }
android {
    namespace = 'org.chmreader'
    compileSdk = 37
    buildToolsVersion = '37.0.0'
    ndkVersion = '28.2.13676358'
    defaultConfig {
        applicationId = 'org.chmreader'
        minSdk = 26
        targetSdk = 37
        versionCode = 2
        versionName = '1.1.0'
        buildConfigField 'String', 'UPDATE_REPOSITORY', '"Kreigen8/chm-reader-android"'
        testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
        ndk { abiFilters.addAll(['arm64-v8a', 'armeabi-v7a', 'x86_64']) }
    }
    externalNativeBuild { cmake { path = file('src/main/cpp/CMakeLists.txt'); version = '3.22.1' } }
    compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
    signingConfigs {
        if (signingFile.exists()) {
            localRelease {
                storeFile = file(localSigning['storeFile'])
                storePassword = localSigning['storePassword']
                keyAlias = localSigning['keyAlias']
                keyPassword = localSigning['keyPassword']
            }
        }
    }
    buildTypes {
        release { minifyEnabled = false; signingConfig = signingFile.exists() ? signingConfigs.localRelease : signingConfigs.debug }
    }
    packaging { jniLibs { useLegacyPackaging = false } }
    buildFeatures { buildConfig = true }
    lint { abortOnError = true }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
    implementation project(':core')
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.activity:activity-ktx:1.10.1'
    implementation 'androidx.core:core-ktx:1.16.0'
    implementation 'androidx.drawerlayout:drawerlayout:1.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.3'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.3'
    implementation 'org.jsoup:jsoup:1.21.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
}
